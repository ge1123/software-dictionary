name: SQL dictionary
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: python3 scripts/atlas/verify-pages.py
      - run: npm run check:er-layout
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  redelivery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: bash labs/rabbitmq-redelivery/run.sh

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, redelivery]
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Deploy to Pages
        id: publish
        uses: actions/deploy-pages@v4
      - name: Tag the deployed commit
        run: |
          deployment_tag="pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push --atomic origin \
            "${GITHUB_SHA}:refs/tags/${deployment_tag}" \
            "+${GITHUB_SHA}:refs/tags/pages-live"
          echo "Deployed [${deployment_tag}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) · \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
